services:
  cloudflare-ddns:
    image: timothyjmiller/cloudflare-ddns:2.2.0
    container_name: cloudflare-ddns
    security_opt:
      - no-new-privileges:true
    network_mode: 'host'
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /nfs/share/data/cloudflare-ddns/config.json:/config.json
    restart: unless-stopped