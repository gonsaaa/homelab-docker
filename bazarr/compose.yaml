services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    network_mode: bridge
    ports:
      - 6767:6767
      
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Lisbon
      
    volumes:
      - /nfs/share/data/bazarr/config:/config
      - /nfs/share/data:/data

    restart: always