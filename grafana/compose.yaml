services:
  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false

    volumes:
      - /nfs/share/data/grafana:/var/lib/grafana
      - /nfs/share/data/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - /nfs/share/data/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - /nfs/share/data/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - traefik-net

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.gonsa.org`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.tls=true"

networks:
  traefik-net:
    external: true