services:
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:v1.102.4
    hostname: headtailscale
    volumes:
      - /nfs/share/data/headtailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_EXTRA_ARGS=--login-server=https://headscale.gonsa.org --advertise-exit-node --advertise-routes=192.168.1.0/24 --accept-dns=true
      - TS_NO_LOGS_NO_SUPPORT=true
      - TS_AUTHKEY=${TS_AUTHKEY}

    logging:               # cap big logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped