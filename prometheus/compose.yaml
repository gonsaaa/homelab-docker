services:
  prometheus:
    image: prom/prometheus:3.14.0
    container_name: prometheus
    user: "1000:1000"
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - /nfs/share/data/prometheus:/prometheus
      - /nfs/share/data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - traefik-net

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - /nfs/share/data/grafana:/var/lib/grafana
      - /nfs/share/data/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - /nfs/share/data/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - /nfs/share/data/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - traefik-net
    labels:
      # Expose Grafana behind Traefik on your usual domain
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.gonsa.org`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.tls=true"

networks:
  traefik-net:
    external: true