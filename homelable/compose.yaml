services:
  backend:
    container_name: homelable-backend
    image: ghcr.io/pouzor/homelable-backend:3.4.1
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - /nfs/share/data/homelable/data:/app/data

    cap_add:
      - NET_RAW

    networks:
      - homelable


  frontend:
    container_name: homelable
    image: ghcr.io/pouzor/homelable-frontend:3.4.1
    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - homelable
      - traefik-net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      - "traefik.http.routers.homelable.rule=Host(`homelable.home.gonsa.org`)"
      - "traefik.http.routers.homelable.entrypoints=https"
      - "traefik.http.routers.homelable.tls=true"

      - "traefik.http.services.homelable.loadbalancer.server.port=80"


networks:
  homelable:
    driver: bridge

  traefik-net:
    external: true