services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.27
    container_name: calibre-web
    #network_mode: bridge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Lisbon
      - DOCKER_MODS=linuxserver/mods:universal-calibre #optional
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1 #optional
    volumes:
      - /nfs/share/data/calibre-web/data:/config
      - /nfs/share/data/calibre-web/library:/books
    ports:
      - 8083:8083
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.calibre-home.rule=Host(`calibre.home.gonsa.org`)"
      - "traefik.http.routers.calibre-home.entrypoints=https"
      - "traefik.http.routers.calibre-home.tls.certresolver=cloudflare"
      
    # Route HTTPS traffic to calibre
      - "traefik.http.routers.calibre.rule=Host(`calibre.gonsa.org`)"
      - "traefik.http.routers.calibre.entrypoints=https"
      - "traefik.http.routers.calibre.tls=true"
      - "traefik.http.routers.calibre.tls.certresolver=cloudflare"
    # Define which internal port app is running on
      - "traefik.http.services.calibre.loadbalancer.server.port=8083"
     # Redirect http to https:
      - "traefik.http.routers.calibre-http.entrypoints=http"
      - "traefik.http.routers.calibre-http.rule=Host(`calibre.gonsa.org`)"

      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.calibre.middlewares=rate-limit@file"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true