services:
  jellystat-db:
    image: postgres:15.2
    container_name: jellystat-db
    environment:
      POSTGRES_DB: 'jfstat'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    security_opt:
      - no-new-privileges:true
    volumes:
    - /nfs/share/data/jellystat/postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  jellystat:
    image: cyfershepard/jellystat:1.1.11
    container_name: jellystat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: 'my-secret-jwt-key'
    ports:
      - "3035:3000"
    volumes:
      - /nfs/share/data/jellystat/backup-data:/app/backend/backup-data
    security_opt:
      - no-new-privileges:true

    depends_on:
      - jellystat-db
    restart: unless-stopped
networks:
  default: