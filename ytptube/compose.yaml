services:
  ytptube:
    user: "${UID:-0}:${UID:-0}" # change this to your user id and group id, for example: "1000:1000"
    image: ghcr.io/arabcoders/ytptube:v2.7.2 
    container_name: ytptube
    restart: unless-stopped
#    network_mode: bridge
    security_opt: 
      - no-new-privileges:true
#    ports:
#      - "8082:8081"
    volumes:
      - /nfs/share/data/ytptube/config:/config:rw
      - /nfs/share/data/ytptube/downloads:/downloads:rw
    tmpfs:
      - /tmp

    labels:
      - "traefik.enable=true"
      - "traefik.http.services.ytptube.loadbalancer.server.port=8082"
      
      # myservice - Local
      - "traefik.http.routers.ytptube-home.rule=Host(`ytptube.home.gonsa.org`)"
      - "traefik.http.routers.ytptube-home.entrypoints=https"
      - "traefik.http.routers.ytptube-home.tls.certresolver=cloudflare"
      - "traefik.http.routers.ytptube-home.service=ytptube"

      # myservice - External
      - "traefik.http.routers.ytptube.rule=Host(`ytptube.gonsa.org`)"
      - "traefik.http.routers.ytptube.entrypoints=https"
      - "traefik.http.routers.ytptube.tls.certresolver=cloudflare"
      - "traefik.http.routers.ytptube.service=ytptube"

      # HTTP redirects for both domains
      - "traefik.http.routers.ytptube-http.entrypoints=http"
      - "traefik.http.routers.ytptube-http.rule=Host(`ytptube.gonsa.org`) || Host(`ytptube.home.gonsa.org`)"
      - "traefik.http.routers.ytptube-http.middlewares=redirect-to-https"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true