services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.33.0
    container_name: dispatcharr
   # restart: unless-stopped

    environment:
      TZ: Europe/Lisbon
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info

    # NVIDIA GPU
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - /nfs/share/data/dispatcharr:/data

    networks:
      - traefik-net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      # Router
      - "traefik.http.routers.dispatcharr.rule=Host(`dispatcharr.home.gonsa.org`)"
      - "traefik.http.routers.dispatcharr.entrypoints=https"
      - "traefik.http.routers.dispatcharr.tls=true"

      # Service
      - "traefik.http.routers.dispatcharr.service=dispatcharr"
      - "traefik.http.services.dispatcharr.loadbalancer.server.port=9191"

  teamarr:
    image: ghcr.io/pharaoh-labs/teamarr:2.24.3
    container_name: teamarr
   # restart: unless-stopped

    environment:
      TZ: Europe/Lisbon
      LOG_LEVEL: INFO

    volumes:
      - /nfs/share/data/teamarr:/app/data

    networks:
      - traefik-net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.teamarr.rule=Host(`teamarr.home.gonsa.org`)"
      - "traefik.http.routers.teamarr.entrypoints=https"
      - "traefik.http.routers.teamarr.tls=true"
      - "traefik.http.routers.teamarr.service=teamarr"
      - "traefik.http.services.teamarr.loadbalancer.server.port=9195"

      # Restrict Teamarr UI to your LAN
      - "traefik.http.routers.teamarr.middlewares=teamarr-lan"
      - "traefik.http.middlewares.teamarr-lan.ipallowlist.sourcerange=192.168.1.0/24"


networks:
  traefik-net:
    external: true
