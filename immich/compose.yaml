name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.1.0
    #extends:
    #   file: hwaccel.transcoding.yml
    #service: cuda # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    environment:
      - TZ=Europe/Lisbon
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
   # ports:
   #   - 2283:2283
    depends_on:
      - redis
      - database
      
    restart: always
    
    healthcheck:
      disable: false
      
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
        # Public domain HTTPS router (Let's Encrypt via Cloudflare)
      - "traefik.http.routers.immich.rule=Host(`immich.gonsa.org`)"
      - "traefik.http.routers.immich.entrypoints=https"
      - "traefik.http.routers.immich.tls.certresolver=cloudflare"
      #  HTTP-to-HTTPS redirect
      - "traefik.http.routers.immich-http.entrypoints=http"
      - "traefik.http.routers.immich-http.rule=Host(`immich.gonsa.org`)"
      - "traefik.http.routers.immich-http.middlewares=immich-https-redirect"
      - "traefik.http.middlewares.immich-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "traefik.http.routers.immich.middlewares=secured@file"

    networks:
      - traefik-net
      - immich-net

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-cuda
    #extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #service: openvino # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    deploy:
     resources:
      reservations:
       devices:
          - driver: nvidia
            count: 1
            capabilities: 
              - gpu
              
    environment:
      - TZ=Europe/Lisbon
      
    volumes:
      - model-cache:/cache
      
    env_file:
      - .env
      
    restart: always
    healthcheck:
      disable: false
      
    networks:
      - immich-net 
    security_opt:
      - no-new-privileges:true

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
    
    healthcheck:
      test: redis-cli ping || exit 1
      
    environment:
      - TZ=Europe/Lisbon
      
    restart: always
    
    networks:
      - immich-net
      
    security_opt:
      - no-new-privileges:true

  database:
    container_name: immich_postgres
    #image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3
    
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      TZ: Europe/Lisbon
      
    volumes:
      #- ${DB_DATA_LOCATION}:/var/lib/postgresql/data
      - ${DB_DATA_LOCATION}:/var/lib/postgresql
      
    shm_size: 128mb
   # healthcheck:
   #   test: pg_isready --dbname='${DB_DATABASE_NAME}' --username='${DB_USERNAME}' || exit 1; Chksum="$$(psql --dbname='${DB_DATABASE_NAME}' --username='${DB_USERNAME}' --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
   #   interval: 5m
   #   start_interval: 30s
   #   start_period: 5m
   # command: ["postgres", "-c" ,"shared_preload_libraries=vectors.so", "-c", 'search_path="$$user", public, vectors', "-c", "logging_collector=on", "-c", "max_wal_size=2GB", "-c", "shared_buffers=512MB", "-c", "wal_compression=on"]
    restart: always
    
    networks:
      - immich-net
      
    security_opt:
      - no-new-privileges:true

volumes:
  model-cache:
  
networks:
  immich-net:
  traefik-net:
    external: true