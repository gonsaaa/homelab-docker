services:
    db:
        image: postgres:16
        container_name: joplin-db
        volumes:
            - /nfs/share/data/joplin/data/postgres:/var/lib/postgresql/data
    #    ports:
    #        - "5432:5432"
        deploy:
          restart_policy:
            condition: any
        environment:
            - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            - POSTGRES_USER=$POSTGRES_USER
            - POSTGRES_DB=joplindb
            - TZ=Europe/Lisbon
        networks:
          - traefik-net
    app:
        image: joplin/server:latest
        container_name: joplin-app
        depends_on:
            - db
     #   ports:
     #       - "22300:22300"
        deploy:
          restart_policy:
            condition: any
        labels:
           - "traefik.enable=true"
           - "traefik.http.routers.joplin.rule=Host(`joplin.gonsa.org`)"
           - "traefik.http.routers.joplin.entrypoints=https"
           - "traefik.http.routers.joplin.tls.certresolver=cloudflare"
            
           - "traefik.http.routers.joplin-http.rule=Host(`joplin.gonsa.org`)"
           - "traefik.http.routers.joplin-http.entrypoints=http"
           - "traefik.http.routers.joplin-http.middlewares=redirect-to-https"
           - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
           - "traefik.http.routers.joplin.middlewares=secured@file"
           - "traefik.http.services.joplin.loadbalancer.server.port=22300"
            
        environment:
            - TZ=Europe/Lisbon
            - MAX_TIME_DRIFT=0
            - APP_PORT=22300
            - APP_BASE_URL=$APP_BASE_URL
            - DB_CLIENT=pg
            - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            - POSTGRES_DATABASE=joplindb
            - POSTGRES_USER=$POSTGRES_USER
            - POSTGRES_PORT=5432
            - POSTGRES_HOST=db
            - MAILER_ENABLED=1
            - MAILER_HOST=$MAILER_HOST
            - MAILER_PORT=587
            - MAILER_SECURITY=starttls
            - MAILER_AUTH_USER=$MAILER_AUTH_USER
            - MAILER_AUTH_PASSWORD=$MAILER_AUTH_PASSWORD
            - MAILER_NOREPLY_NAME=JoplinServer
            - MAILER_NOREPLY_EMAIL=$MAILER_NOREPLY_EMAIL
        networks:
          - traefik-net



networks:
  traefik-net:
    external: true