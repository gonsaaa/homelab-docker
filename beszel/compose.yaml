services:
  beszel:
    image: henrygd/beszel:v0.19.0
    container_name: beszel
    restart: unless-stopped
   # ports:
   #   - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    labels:
      - "traefik.enable=true"
    # Route HTTPS traffic to beszel
      - "traefik.http.routers.beszel.rule=Host(`beszel.gonsa.org`)"
      - "traefik.http.routers.beszel.entrypoints=https"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.routers.beszel.tls.certresolver=cloudflare"
     # Redirect http to https:
      - "traefik.http.routers.beszel-http.entrypoints=http"
      - "traefik.http.routers.beszel-http.rule=Host(`beszel.gonsa.org`)"
      - "traefik.http.routers.beszel-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # Secure = crowdsec & rate-limit
      - "traefik.http.routers.beszel.middlewares=secured@file"
    networks:
      - traefik-net

  beszel-agent:
    image: "henrygd/beszel-agent"
    container_name: "beszel-agent"
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45876
      KEY: ${KEY}

networks:
  traefik-net:
    external: true