services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    ports:
      - 9696:9696
      
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Lisbon
      
    volumes:
      - /nfs/share/data/prowlarr/config:/config

    restart: unless-stopped