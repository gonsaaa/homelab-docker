# Self-hosted service to sync your plex, jellyfin and emby play state. without relying on 3rd-party external services.
services:
    watchstate:
        image: ghcr.io/arabcoders/watchstate:latest
        # To change the user/group id associated with the tool change the following line.
        user: "${UID:-1000}:${GID:-1000}"
        container_name: watchstate
        restart: unless-stopped
        ports:
            - "8092:8080" # The port which the webui will be available on.
        volumes:
            - /nfs/share/data/watchstate/data:/config:rw # mount current directory to container /config directory