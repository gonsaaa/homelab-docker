services:
  metube:
    image: ghcr.io/alexta69/metube:2026.08.28
    container_name: metube
    restart: unless-stopped
    environment:
      - DELETE_FILE_ON_TRASHCAN=true
    networks:
      - traefik-net
  #  ports:
  #    - "8079:8081"
    volumes:
      - /nfs/share/data/metube:/downloads
    security_opt:
      - no-new-privileges:true
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metube.rule=Host(`metube.gonsa.org`)"
      - "traefik.http.routers.metube.entrypoints=https"
      - "traefik.http.routers.metube.tls.certresolver=cloudflare"
      - "traefik.http.services.metube.loadbalancer.server.port=8081"
     # (crowdsec and rate-limit)
      - "traefik.http.routers.metube.middlewares=rate-limit@file,authentik@file"

networks:
  traefik-net:
    external: true