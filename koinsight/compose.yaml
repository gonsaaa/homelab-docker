name: koinsight
services:
  koinsight:
    image: ghcr.io/ko-insight/koinsight:v0.2.3
    container_name: koinsight
    restart: unless-stopped
  #  ports:
  #    - "3000:3000"
    volumes:
      - /nfs/share/data/koinsight:/app/data

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.koinsight.rule=Host(`koinsight.gonsa.org`)"
      - "traefik.http.routers.koinsight.entrypoints=https"
      - "traefik.http.routers.koinsight.tls.certresolver=cloudflare"
      # HTTP redirect to HTTPS
      - "traefik.http.routers.koinsight-http.entrypoints=http"
      - "traefik.http.routers.koinsight-http.rule=Host(`koinsight.gonsa.org`)"
      - "traefik.http.routers.koinsight-http.middlewares=redirect-to-https"
      - "traefik.http.services.koinsight.loadbalancer.server.port=3000"
      - "traefik.http.routers.koinsight.middlewares=rate-limit@file"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true