services:
  stash:
    image: stashapp/stash:v0.31.1
    container_name: stash
    #restart: unless-stopped
    ## the container's port must be the same with the STASH_PORT in the environment section
 #   ports:
 #     - "9999:9999"
    ## If you intend to use stash's DLNA functionality uncomment the below network mode and comment out the above ports section
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default port (9999)
      - STASH_PORT=9999
    volumes:
      - /nfs/share/data/stash/etc/localtime:/etc/localtime:ro
      ## Adjust below paths (the left part) to your liking.
      ## E.g. you can change ./config:/root/.stash to ./stash:/root/.stash
      
      ## Keep configs, scrapers, and plugins here.
      - /nfs/share/data/stash:/root/.stash
      ## Point this at your collection.
      - /nfs/share/zgg:/data
      ## This is where your stash's metadata lives
      - /nfs/share/data/stash/metadata:/metadata
      ## Any other cache content.
      - /nfs/share/data/stash/cache:/cache
      ## Where to store binary blob data (scene covers, images)
      - /nfs/share/data/stash/blobs:/blobs
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - /nfs/share/data/stash/generated:/generated

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
    
      # Stash backend
      - "traefik.http.services.stash.loadbalancer.server.port=9999"
    
      # Local HTTPS
      - "traefik.http.routers.stash-home.rule=Host(`stash.home.gonsa.org`)"
      - "traefik.http.routers.stash-home.entrypoints=https"
      - "traefik.http.routers.stash-home.tls=true"
      - "traefik.http.routers.stash-home.tls.certresolver=cloudflare"
      - "traefik.http.routers.stash-home.service=stash"
    
      # External HTTPS
      - "traefik.http.routers.stash.rule=Host(`stash.gonsa.org`)"
      - "traefik.http.routers.stash.entrypoints=https"
      - "traefik.http.routers.stash.tls=true"
      - "traefik.http.routers.stash.tls.certresolver=cloudflare"
      - "traefik.http.routers.stash.service=stash"
    
      # HTTP -> HTTPS
      - "traefik.http.routers.stash-http.entrypoints=http"
      - "traefik.http.routers.stash-http.rule=Host(`stash.gonsa.org`) || Host(`stash.home.gonsa.org`)"
      - "traefik.http.routers.stash-http.middlewares=redirect-to-https"
      - "traefik.http.routers.stash-http.service=noop@internal"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true